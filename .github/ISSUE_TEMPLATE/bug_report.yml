name: "🐛 Bug Report"
description: "File a bug report or numerical discrepancy in simulation results"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug or numerical issue in **kTES.jl**!
        Please fill out the details below to help us reproduce and fix it.
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "e.g., Calling simulate_acquisition with TSE sequence throws an InexactError..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Minimal Reproducible Example"
      description: "Please provide a self-contained, minimal code snippet that triggers the issue."
      render: julia
      placeholder: |
        using kTES
        sys = Scanner()
        phantom = brain_phantom_LF()
        # ... reproducible code ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected vs. Actual Behavior"
      description: "What did you expect to happen, and what happened instead? Include full stack traces or NRMSE / MAD metrics if applicable."
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: "Hardware & Acceleration Backend"
      description: "Which compute device / backend was used when the error occurred?"
      options:
        - "CPU (Single thread)"
        - "CPU (Multi-threaded)"
        - "CUDA (NVIDIA GPU)"
        - "Metal (Apple Silicon)"
        - "AMDGPU (AMD ROCm)"
        - "oneAPI (Intel GPU)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Environment Details"
      description: "Julia version, kTES.jl version, and OS (e.g. Julia 1.10.10, Windows 11 / Linux Ubuntu 22.04)."
      placeholder: "Julia 1.10.10, kTES.jl v0.0.1, OS: ..."
    validations:
      required: true
