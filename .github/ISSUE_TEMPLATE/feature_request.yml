name: "✨ Feature Request"
description: "Suggest a new sequence, phantom, hardware backend, or simulation feature"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve **kTES.jl**!
        Please describe the proposed feature or enhancement in detail.
  - type: textarea
    id: problem
    attributes:
      label: "Problem / Motivation"
      description: "Is your feature request related to a specific MRI simulation bottleneck, missing pulse sequence, or physics capability?"
      placeholder: "e.g., Currently, simulating diffusion or non-Cartesian trajectories requires manual..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Proposed Solution"
      description: "A clear and concise description of what you want to happen."
      placeholder: "Describe how the function, struct, or interface should look in kTES.jl..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any alternative workarounds or designs you've considered."
    validations:
      required: false
  - type: textarea
    id: additional_context
    attributes:
      label: "Additional Context / References"
      description: "Any links to literature, MR physics papers, or sequence diagrams."
    validations:
      required: false
